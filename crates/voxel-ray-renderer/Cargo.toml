[package]
name = "voxel-ray-renderer"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu_profiling = []
shader_hot_reload = ["dep:notify"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5.15"
log = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
bitflags = { workspace = true }
tracy-client = { workspace = true }
bevy = { workspace = true }
voxel-data = { version = "0.1.0", path = "../voxel-data" }
tile-data = { version = "0.1.0", path = "../tile-data" }
voxel-gpu = { version = "0.1.0", path = "../voxel-gpu" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { version = "8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
