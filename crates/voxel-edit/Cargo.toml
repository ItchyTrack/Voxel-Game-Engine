[package]
name = "voxel-edit"
version = "0.1.0"
edition = "2024"

[features]
default = []
tracy = ["tracy-client/enable"]

[dependencies]
bevy = { workspace = true }
bevy_ecs = "0.19.0"
bevy-trait-query = "0.19.0"
tracy-client = { workspace = true }
voxel-data = { version = "0.1.0", path = "../voxel-data" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
