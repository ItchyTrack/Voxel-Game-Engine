[package]
name = "voxel-bvh"
version = "0.1.0"
edition = "2024"

[features]
default = []
tracy = ["tracy-client/enable"]
gpu_profiling = []

[dependencies]
log = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
tracy-client = { workspace = true }
bevy = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
