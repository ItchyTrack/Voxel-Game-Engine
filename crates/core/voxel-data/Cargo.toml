[package]
name = "voxel-data"
version = "0.1.0"
edition = "2024"

[features]
default = []
tracy = ["tracy-client/enable"]
gpu_profiling = []

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_log", "multi_threaded"] }
tracy-client = { workspace = true }
bytemuck = { workspace = true }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
smallvec = "1.15"
zstd = "0.13"
voxel-tasks = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "grid_tree"
harness = false

[[bench]]
name = "reduce_grid_tree"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
