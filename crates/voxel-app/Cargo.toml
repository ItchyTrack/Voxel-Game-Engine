[package]
name = "voxel-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "coverage_scene_fuzz"
path = "tests/coverage_scene_fuzz.rs"
harness = false

[features]
default = []
gpu_profiling = []
tracy = [
	"dep:tracing-tracy",
	"bevy/trace",
	"voxel-data/tracy",
	"voxel-physics/tracy",
	"voxel-gpu/tracy",
	"voxel-sources/tracy",
	"tracy-client/enable",
]

[dependencies]
dot_vox = "5.2.0"
nalgebra = "0.34.1"
rtrb = "0.3.2"
bevy_egui = "0.40"
log = { workspace = true }
bevy = { workspace = true }
wgpu = { workspace = true }
tracing-tracy = { version = "0.11", default-features = false, features = ["enable", "broadcast"], optional = true }
tracy-client = { workspace = true }
camera-voxel-loader = { version = "0.1.0", path = "../camera-voxel-loader" }
voxel-ray-renderer = { version = "0.1.0", path = "../voxel-ray-renderer", features = ["shader_hot_reload"] }
voxel-raster-renderer = { version = "0.1.0", path = "../voxel-raster-renderer", features = ["shader_hot_reload"] }
voxel-data = { version = "0.1.0", path = "../voxel-data" }
basic-voxel = { version = "0.1.0", path = "../basic-voxel" }
voxel-tasks = { version = "0.1.0", path = "../voxel-tasks" }
voxel-gpu = { version = "0.1.0", path = "../voxel-gpu" }
voxel-physics = { version = "0.1.0", path = "../voxel-physics" }
voxel-streaming = { version = "0.1.0", path = "../voxel-streaming" }
voxel-sources = { version = "0.1.0", path = "../voxel-sources" }
voxel-lightyear = { version = "0.1.0", path = "../voxel-lightyear" }
voxel-edit = { version = "0.1.0", path = "../voxel-edit" }
voxel-engine = { version = "0.1.0", path = "../voxel-engine" }
voxel-content = { version = "0.1.0", path = "../voxel-content" }
lightyear = { version = "0.28.0", features = ["udp", "netcode"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt", "sync"] }
cpal = { version = "0.16", features = ["wasm-bindgen"] }
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }
console_error_panic_hook = "0.1.7"
console_log = "1.0"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4"
wasm_thread = { version = "0.3", features = ["es_modules"] }
raw-window-handle = "0.6"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "Window", "XmlHttpRequest", "XmlHttpRequestResponseType"] }
web-time = "1.1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
