[package]
name = "voxel-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu_profiling = []
tracy = [
	"dep:tracing-tracy",
	"bevy/trace",
	"voxel-data/tracy",
	"voxel-physics/tracy",
	"gpu-voxel-data/tracy",
]

[dependencies]
dot_vox = "5.2.0"
nalgebra = "0.34.1"
rtrb = "0.3.2"
bevy_egui = "0.39"
log = { workspace = true }
tokio = { workspace = true }
bevy = { workspace = true }
wgpu = { workspace = true }
tracing-tracy = { version = "0.11", default-features = false, features = ["enable", "broadcast"], optional = true }
voxel-renderer = { version = "0.1.0", path = "../voxel-renderer" }
camera-lods = { version = "0.1.0", path = "../camera-lods" }
voxel-data = { version = "0.1.0", path = "../voxel-data" }
gpu-voxel-data = { version = "0.1.0", path = "../gpu-voxel-data" }
voxel-physics = { version = "0.1.0", path = "../voxel-physics" }
voxel-streaming = { version = "0.1.0", path = "../voxel-streaming" }
voxel-sources = { version = "0.1.0", path = "../voxel-sources" }
voxel-edit = { version = "0.1.0", path = "../voxel-edit" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.16", features = ["wasm-bindgen"] }
getrandom = { workspace = true }
getrandom_0_3 = { workspace = true }
console_error_panic_hook = "0.1.7"
console_log = "1.0"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-time = "1.1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
