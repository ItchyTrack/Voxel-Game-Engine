[package]
name = "voxel-sources"
version = "0.1.0"
edition = "2024"

[features]
default = []
tracy = ["tracy-client/enable"]

[dependencies]
crossbeam-channel = "0.5.15"
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
voxel-data = { version = "0.1.0", path = "../voxel-data" }
voxel-tasks = { version = "0.1.0", path = "../voxel-tasks" }
tracy-client = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.114"
js-sys = "0.3"
wasm_thread = { version = "0.3", features = ["es_modules"] }
web-sys = { version = "0.3", features = ["console"] }

[lints]
workspace = true
