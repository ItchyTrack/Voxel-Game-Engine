[package]
name = "voxel-renderer"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu_profiling = []

[dependencies]
anyhow = "1.0"
glam = "0.30.10"
log = "0.4"
wgpu = "27"
bytemuck = { version = "1.24", features = [ "derive" ] }
bevy = "0.18.1"
voxel-data = { version = "0.1.0", path = "../voxel-data" }
gpu-voxel-data = { version = "0.1.0", path = "../gpu-voxel-data" }
voxel-bvh = { version = "0.1.0", path = "../voxel-bvh" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] } # dep of rand
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] } # dep of dot_vox
wgpu = { version = "27", features = ["webgpu"]}

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
