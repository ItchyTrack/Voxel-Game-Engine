[workspace]
resolver = "3"

members = [
	"crates/voxel-data",
	"crates/voxel-edit",
	"crates/voxel-gpu",
	"crates/voxel-streaming",
	"crates/camera-voxel-loader",
	"crates/voxel-sources",
	"crates/voxel-lightyear",
	"crates/voxel-renderer",
	"crates/voxel-physics",
	"crates/voxel-content",
	"crates/voxel-app",
	"crates/voxel-engine",
	"crates/bevy-web-worker",
]

default-members = [
	"crates/voxel-app",
]

[profile.release]
strip = true

[workspace.dependencies]
bevy = "0.18.1"
wgpu = "27"
log = "0.4"
num = "0.4.3"
bytemuck = { version = "1.24", features = ["derive"] }
tracy-client = { version = "0.18.4", default-features = false }
tokio = "1"
# wasm-only shims (dep of rand / dot_vox)
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
